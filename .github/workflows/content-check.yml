name: content-check

on:
  pull_request:
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'package.json'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      # Gate qualità editoriale (P11) — fallisce su violazioni pubblicazione
      - run: npm run check:content
      # Il build deve riuscire (validazioni A.3: campi, author, practice, deal, blocklist)
      - run: npm run build
